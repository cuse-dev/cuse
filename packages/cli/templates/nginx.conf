events {
    worker_connections 1024;
}

http {
    # Add resolver for Docker's DNS
    resolver 127.0.0.11 valid=30s;  # Docker's embedded DNS server
    resolver_timeout 5s;

    # Extract component name from the URL path
    map $request_uri $path_component {
        "~^/([^/]+)/" $1;
        default "";
    }

    # Extract the component name from the Referer header
    map $http_referer $referer_component {
        "~^https?://[^/]+(:\d+)?/([^/]+)/" $2;
        default "";
    }

    # Determine the final component to use
    map $path_component $target_component {
        "" $referer_component;
        default $path_component;
    }

    server {
        listen 4242;
        server_name localhost;

        # Handle docs requests specifically
        location ~ ^/docs/ {
            proxy_pass http://$referer_component:8000/$referer_component$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer $http_referer;
        }

        # Handle requests with component in path
        location ~ ^/([^/]+)/(.*)$ {
            set $component $1;
            set $path $2;
            
            proxy_pass http://$component:8000/$component/$path;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer $http_referer;
        }

        # Handle requests without component in path
        location / {
            # Use the target_component determined from either path or referer
            proxy_pass http://$target_component:8000/$target_component$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer $http_referer;
        }

                # noVNC WebSocket endpoint
        location ~ ^/([^/]+)/websockify$ {
            proxy_pass http://$1:6080/websockify;
            proxy_http_version 1.1;
            proxy_read_timeout 61s;
            proxy_buffering off;
        }

        # VNC endpoint
        location ~ ^/([^/]+)/vnc/?(.*)$ {
            proxy_pass http://$1:5900/$2;
            proxy_http_version 1.1;
        }
    }
}